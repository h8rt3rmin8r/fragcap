[package]
name = "fragcap-http-mitm-proxy-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
async-http-proxy = { version = "1.2", features = ["runtime-tokio"] }
bytes = "1"
http-body-util = "0.1"
http-mitm-proxy = { version = "=0.18.0", default-features = false, features = ["native-tls-client"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
hyper-tungstenite = "0.19"
native-tls = { version = "0.2", features = ["alpn"] }
rcgen = { version = "0.14.3", features = ["pem", "x509-parser"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-native-tls = "0.3"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }

[dev-dependencies]
assert_cmd = "2"
