[package]
name = "fragcap-proxy"
description = "Native loopback proxy runtime for fragcap Deep Capture."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
tokio.workspace = true

# Selected and compiled as one reviewed protocol stack in S102. Protocol use is
# deliberately deferred: this slice proves bounded runtime ownership without
# parsing, forwarding, decrypting, or claiming inspectability.
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
rustls-native-certs.workspace = true
ring.workspace = true
subtle.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
] }

[dev-dependencies]
quinn.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
x509-parser.workspace = true
