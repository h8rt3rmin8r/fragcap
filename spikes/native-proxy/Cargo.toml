[package]
name = "fragcap-native-proxy-spike"
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
async-http-proxy = { version = "1.2", features = ["runtime-tokio"] }
http = "1"
http-body-util = "0.1"
hudsucker = { version = "=0.23.0", default-features = false, features = [
    "decoder",
    "http2",
    "native-tls-client",
    "rcgen-ca",
] }
hyper-tls = "0.6"
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = [
    "http2",
    "native-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-native-tls = "0.3"
tokio-rustls = "0.26"
hyper-tungstenite = "0.15"

[dev-dependencies]
assert_cmd = "2"
