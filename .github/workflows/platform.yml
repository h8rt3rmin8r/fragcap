# Windows platform tests that need the capture driver. Specification 24.2.
#
# NOTE: as of slice S09 this workflow has a subject, and real triggers. It had
# neither before: no crate linked against the capture library, so the software
# development kit acquisition step below had never run. It still has not been
# watched to completion, and must not be reported as passing until it has.
#
# Slice S10 added a second subject, and it is a different kind. The socket table
# backend in `fragcap-attr` needs Windows and nothing else, so unlike everything
# below it, its tests actually run on a runner with no npcap installed. They
# were also run to completion on a developer machine before this file was
# changed, which is more than the capture half has ever managed.
#
# The kit is acquired at build time and never vendored, per specification
# section 20.2 and the constitution's licensing section. `cargo xtask lint`
# fails if any of its files reach the repository.
name: platform

# S09 gave this real triggers, replacing dispatch-only. A dated decision is
# recorded in changelog.d, per the pinned-artifact rule.
#
# This workflow tests the whole workspace, so every pull request and every
# main-branch change can change its answer. A narrower path list drifted from
# the job during S106 and skipped the follow-up that fixed a Windows-only test.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Acquired at build time. Never committed, never bundled into any artifact.
  NPCAP_SDK_URL: https://npcap.com/dist/npcap-sdk-1.13.zip

jobs:
  windows-capture:
    name: windows capture tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Slice S10. Deliberately before the software development kit is
      # acquired, and not gated on the capture driver being present, because
      # the socket table backend needs neither. The IP Helper API and the
      # toolhelp snapshot ship with the operating system, so this is the first
      # step in this workflow that can go green on a bare Windows runner and
      # the first that does not depend on an external download succeeding.
      #
      # Its feature is `socket-table` and not `live` for exactly that reason;
      # see crates/fragcap-attr/Cargo.toml.
      - name: Build and test the socket table backend
        run: |
          cargo test -p fragcap-attr --features socket-table --locked
          cargo test -p fragcap-attr --features socket-table --locked -- --ignored

      - name: Acquire the npcap SDK
        shell: pwsh
        run: |
          # Downloaded at build time and discarded with the runner. npcap is
          # not redistributable, so it is never vendored and never enters an
          # artifact. Specification section 20.2.
          Invoke-WebRequest -Uri $env:NPCAP_SDK_URL -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk
          "LIB=$PWD\npcap-sdk\Lib\x64;$env:LIB" >> $env:GITHUB_ENV

      - name: Build the live capture source
        # The step that proves the acquisition above worked. `cargo check` does
        # not link, so this is a build: a missing `wpcap.lib` shows up at the
        # link step and nowhere earlier.
        run: cargo build -p fragcap-capture --features live --locked

      # The software development kit supplies the import library, which is what
      # the build above needs. It does NOT supply `wpcap.dll`, which ships with
      # the npcap driver installation and which any binary linked against
      # `wpcap.lib` needs at load time.
      #
      # This distinction cost slice S09 a red build, and the lesson is worth
      # keeping: a test binary built with `--features live` does not start at
      # all without the driver present. It fails with STATUS_DLL_NOT_FOUND
      # before `main` runs, so the "detect at runtime and skip" design in those
      # tests never gets a chance to execute. Enabling the feature
      # unconditionally here would make this workflow permanently red for a
      # reason that has nothing to do with the code.
      # Slice S11. The same shape as the step above and for the same reason:
      # `cargo check` does not link, so a build is what proves the ETW binding
      # resolves. Unlike npcap this needs no software development kit, because
      # `windows-sys` links against libraries the toolchain already has.
      - name: Build the ETW process watcher
        run: cargo build -p fragcap-attr --features etw --locked

      # Slice S11. Consuming a kernel trace session needs administrative
      # privilege (constraint C-4, section 19.5), and whether a hosted runner
      # has it is a property of the runner rather than of the code. Checked
      # rather than assumed, for the reason the note above this job records: a
      # workflow that assumes its precondition goes red for a reason that has
      # nothing to do with the change under test.
      - name: Check whether this runner is elevated
        id: elevated
        shell: pwsh
        run: |
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $p = New-Object Security.Principal.WindowsPrincipal($id)
          $admin = $p.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          "elevated=$($admin.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($admin) {
            Write-Host "This runner is elevated; the tier 2 process tests will run."
          } else {
            Write-Host "This runner is NOT elevated."
            Write-Host "The ETW watcher was built and linked, which is what the step above proves."
            Write-Host "Tier 2 process tests need an elevated session and will NOT run."
            Write-Host "Nothing here has exercised live process observation."
          }

      - name: Tier 2 process tests
        if: steps.elevated.outputs.elevated == 'true'
        run: cargo test -p fragcap-attr --features etw --locked -- --ignored

      - name: Look for an installed capture driver
        id: driver
        shell: pwsh
        run: |
          $dll = Join-Path $env:SystemRoot "System32\wpcap.dll"
          $present = Test-Path -LiteralPath $dll
          "present=$($present.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($present) {
            Write-Host "npcap is installed; tier 2 tests will run."
          } else {
            Write-Host "npcap is NOT installed on this runner."
            Write-Host "The live source was built and linked, which is what the step above proves."
            Write-Host "Tier 2 tests need the driver and will NOT run. Nothing here has exercised live capture."
          }

      - name: Tier 2 tests
        if: steps.driver.outputs.present == 'true'
        # The feature is `live`, not `platform-tests`. It gates a capability
        # rather than a test suite; see slice S09 plan decision D-2.
        run: cargo test --workspace --features fragcap-capture/live --locked

      - name: Tests without the capture driver
        if: steps.driver.outputs.present != 'true'
        # Everything that does not need a driver, on Windows, with the software
        # development kit present. Proves the workspace is healthy here even
        # though live capture was not exercised.
        run: cargo test --workspace --locked
