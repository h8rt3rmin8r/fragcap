[package]
name        = "fragcap-steam"
description = "Steam platform integration."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"

[features]
# Exposes the synthetic appinfo byte generator (`appinfo::fixtures`) for other
# crates' tests, notably the facade's end-to-end launch-accumulation test (slice
# S038). Off by default and never enabled in a normal build, so the generator is
# excluded from the shipped library; it is a test scaffold, not product code.
test-support = []

[dependencies]
fragcap-profile.workspace = true
serde_json.workspace      = true

# Windows-only. Registry read for the Steam install path
# (Win32_System_Registry) and the steam:// protocol handler for managed launch
# (Win32_UI_Shell). Additive features on the workspace's already-resolved 0.36
# pin: no new package in Cargo.lock, no change to the resolved version. See the
# S17 decisions fragment (chose windows-sys over the crate table's winreg to
# avoid a second Windows-binding tree, mirroring S10).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }
