# Certified Windows artifacts and crate publication. Specification sections 24.4 and 24.5.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    name: validate release identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert the tag matches the workspace version
        shell: bash
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "$tagged" = "$declared"
          echo "tag and workspace version agree on $declared"

  package-certification:
    name: build and certify release packages
    needs: identity
    uses: ./.github/workflows/package-certification.yml

  release:
    name: create the tagged release
    needs: package-certification
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: fragcap-windows-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-package-certification-summary
          path: certification
      - name: Independently revalidate certified bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 6
          for sidecar in dist/*.sha256; do (cd dist && sha256sum --check "$(basename "$sidecar")"); done
          cargo xtask package-certification validate-report certification/report.json dist
      - name: Validate and render the AI-written release highlights
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --package xtask -- notes "${GITHUB_REF_NAME#v}" > notes.md
          cat notes.md
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --title "fragcap $GITHUB_REF_NAME" --notes-file notes.md --verify-tag dist/*.zip dist/*.msi dist/*.db dist/*.sha256

  publish:
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order
        run: cargo run --package xtask -- publish --execute
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
