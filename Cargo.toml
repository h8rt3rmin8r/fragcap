[workspace]
members  = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
# The minimum version a consumer needs. Distinct from the toolchain this
# repository builds with, which rust-toolchain.toml pins. Verified by
# `cargo xtask msrv`; see specs/001-workspace-scaffold/research.md R-1.
rust-version = "1.82"
license      = "Apache-2.0"
repository   = "https://github.com/h8rt3rmin8r/fragcap"
homepage     = "https://github.com/h8rt3rmin8r/fragcap"
authors      = ["William Thompson"]
keywords     = ["pcap", "pcapng", "capture", "attribution", "windows"]
categories   = ["network-programming"]

[workspace.dependencies]
# External. Slice S02, plan D-1: reference-counted payload clones, MIT licensed,
# declares a 1.57 minimum, and pulls in no transitive dependencies.
bytes           = "1.12"

# External. Slice S05, research R-1: TOML parsing for game profiles, with byte
# spans on every value so a diagnostic can point an author at their own line.
# Chosen over `toml` because that crate's 1.1 line declares Rust 1.85 against
# this workspace's 1.82 minimum, and pinning it to 1.0 does not help: its own
# `toml_parser` dependency resolves to 1.1.3 and declares 1.85 too. Two crates
# in the graph, no serde, MIT or Apache-2.0.
toml-span       = "0.7"

# External. Slice S05, research R-3: compiles the `path_regex` match predicate
# of specification section 10.3. Default features are off because
# `aho-corasick` and `memchr` accelerate scanning large haystacks and a haystack
# here is one process image path. `unicode` stays on: an image path can carry
# non-ASCII through a user or localized directory name, and a pattern must behave
# the way the documented engine behaves. The same engine evaluates in S12, which
# is a requirement rather than a coincidence. MIT or Apache-2.0.
regex           = { version = "1.13", default-features = false, features = [
    "std",
    "unicode",
] }

# External, optional. Slice S09, research R-1: the libpcap and npcap binding
# the live capture source is built on. Optional and off by default, so building
# the workspace and running the ordinary check set needs neither the capture
# driver nor its software development kit.
#
# Chosen over a hand-rolled binding because the alternative here is not
# arithmetic over a byte slice, as it was in S03 and S06, but a C ABI whose
# struct layouts must be transcribed by hand with nothing checking them against
# the header. A wrong offset in the packet header yields plausible timestamps
# that are wrong, which is the P-9 failure no test over synthetic data catches.
#
# MIT or Apache-2.0, and so is every crate it pulls. Declares Rust 1.64 against
# this workspace's 1.82 floor. Note that its build dependency on `libloading`
# is pinned to the 0.8 line: `libloading` 0.9 declares Rust 1.88 and would take
# the workspace below its own minimum.
pcap            = "2.4"

# External. Slice S10, research R-3: the attribution snapshot publication of
# specification section 11.6, which requires that the capture thread read the
# current snapshot without locking while the control thread replaces it.
#
# The alternative worth naming is `RwLock<Arc<Index>>`, which is the tempting
# one and is a lock: a reader can block behind a writer, and the reader here is
# the acquisition path that section 11.6 exists to keep unblocked. It would
# satisfy a test and not the requirement, which is worse than failing both.
# A hand-rolled `AtomicPtr` is correct and needs a reclamation scheme written
# in `unsafe`, in a workspace that has none outside a platform binding.
#
# MIT or Apache-2.0, no dependencies of its own, edition 2018 with no declared
# minimum toolchain, so it cannot move `cargo xtask msrv`.
arc-swap        = "1.9"

# External, optional. Two backends are built on this, and they share one entry
# rather than two on purpose.
#
# Slice S10, research R-1 and R-4: the IP Helper socket table and query-only
# process enumeration that flow attribution is built on, behind the
# `socket-table` feature.
#
# Slice S11, research R-1: the ETW session the process watcher consumes, behind
# the `etw` feature. Chosen over `ferrisetw`, which specification Appendix A
# names, on measured grounds: `ferrisetw` resolves to thirty crates including a
# bignum stack and a random number generator that a passive observer of process
# events has no use for, and it wraps this same generated binding a version line
# behind. The value in a platform binding is in who guarantees the struct
# layouts, which is the argument S09 gave for taking `pcap`, and it points here.
# The kernel process provider's events are fixed MOF layouts rather than
# manifest-based ones, so the schema parsing a wrapper would supply is not the
# parsing S11 needs.
#
# Pinned to the 0.36 line because `pcap` already resolves it there, so this adds
# no package to Cargo.lock at all. Taking the current line would put a second
# complete windows-sys tree in the graph for declarations that have not changed.
# S11 initially took 0.61 and moved to 0.36 during integration, having checked
# that every symbol its watcher names resolves there. MIT or Apache-2.0,
# declares Rust 1.64.
#
# Note that none of this is npcap. The IP Helper API and ETW both ship with the
# operating system, so neither backend needs a capture driver or a software
# development kit, which is why neither feature is `live`.
#
# `Win32_System_Time` is in the list and is not obvious: it gates
# `EVENT_TRACE_LOGFILEW` and `OpenTraceW`, not the ETW feature group.
windows-sys     = { version = "0.36", default-features = false, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Time",
] }

# External, test-only. Slice S07, research R-1: the JSON Lines writer is
# hand-rolled because its exact byte shape is the deliverable, and this parses
# every line it emits so validity is judged by something other than the writer.
# Never a runtime dependency; it appears only under [dev-dependencies].
serde_json      = "1.0"

fragcap-core    = { version = "0.1.0", path = "crates/fragcap-core" }
fragcap-profile = { version = "0.1.0", path = "crates/fragcap-profile" }
fragcap-capture = { version = "0.1.0", path = "crates/fragcap-capture" }
fragcap-attr    = { version = "0.1.0", path = "crates/fragcap-attr" }
fragcap-sink    = { version = "0.1.0", path = "crates/fragcap-sink" }
fragcap-steam   = { version = "0.1.0", path = "crates/fragcap-steam" }
fragcap         = { version = "0.1.0", path = "crates/fragcap" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "debuginfo"
