[package]
name        = "fragcap-cli"
description = "Command line interface for fragcap."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
readme                 = "README.md"
categories             = ["command-line-utilities", "network-programming"]

[features]
# Passed through to the facade so the tier-2 backends compile under the
# --all-features clippy gate. All off by default: the whole tier-1 surface runs
# with no capture driver, no elevation, and no game. Slice S14.
default      = []
live         = ["fragcap/live"]
socket-table = ["fragcap/socket-table"]
etw          = ["fragcap/etw"]
# The live catalog seeder (issue #78, slice S035). Off by default: the shipped tool
# seeds offline from a fixture; a maintainer builds with `--features net` to seed
# the hint database from the Steam Web API. End users consume the shipped data file
# (#58) and never seed, so they never pay for the HTTP client.
# The `doctor --fix` npcap fetch action downloads the vendor's own signed installer
# (slice S056), so the CLI reaches the HTTP client behind the same `net` gate the
# catalog seeder uses. `http_req` is already in the graph via fragcap-targets, so
# this adds no Cargo.lock package.
net          = ["fragcap/net", "dep:http_req"]

# The library is the testable product: `fragcap_cli::run` drives the whole
# command surface without spawning a process. The binary is a shim over it.
[lib]
name = "fragcap_cli"
path = "src/lib.rs"

[[bin]]
name = "fragcap"
path = "src/main.rs"

[dependencies]
# `targets` is enabled unconditionally: the shipped tool carries the `targets`
# subcommand (issue #78, slice S034). Unlike live/socket-table/etw, the targets
# store needs no capture driver and no elevation, only the C toolchain at build
# time, so it is on by default here while staying off at the facade for library
# consumers that do not want the embedded database.
fragcap              = { workspace = true, features = ["targets"] }
clap.workspace       = true
ctrlc.workspace      = true
serde_json.workspace = true
# The HTTP client for the `doctor --fix` npcap installer fetch, behind `net`. Off
# by default, so the shipped end-user build never compiles it (slice S056).
http_req             = { workspace = true, optional = true }

# Windows only, for the `doctor` elevation probe, the npcap version read, and the
# Wireshark install-directory registry lookup. Pinned to the same 0.36 line
# fragcap-attr already resolves (see the workspace manifest for why), so this adds
# no second windows-sys tree to Cargo.lock. The token features the elevation probe
# reads, `Win32_Storage_FileSystem` for the wpcap.dll FileVersion read, and
# `Win32_System_Registry` for reading the machine-wide Wireshark install location
# the MSI registers extcap into; `Win32_Foundation` is already in the workspace
# set.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

# Windows only, at build time: stamps the exe's PE VERSIONINFO (FileVersion and
# ProductVersion) from CARGO_PKG_VERSION so `Get-Command fragcap` no longer reports
# 0.0.0.0 (issue #104). `default-features = false` drops winresource's optional
# `toml` dependency (which declares Rust 1.85 and would break the 1.82 MSRV gate,
# the trap slice S05 documented); we set every field through the API instead. This
# is the workspace's first build-dependency; it adds only `winresource` and
# `version_check` to Cargo.lock, both MIT/Apache-2.0.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[dev-dependencies]
tempfile.workspace   = true
# The help guard matches leak patterns over rendered help pages. Already a
# runtime dependency of `fragcap-profile`, so this adds no package to
# `Cargo.lock`; it is a direct edge only.
regex.workspace      = true
# The synthetic appinfo generator for the launch-accumulation integration test
# (slice S038). This test lives here rather than in the facade because the CLI
# carries the `targets` feature unconditionally, so the test runs under the
# default `cargo test --workspace` gate; the facade is tested there with default
# features only.
fragcap-steam = { workspace = true, features = ["test-support"] }
