[package]
name        = "fragcap"
description = "Facade re-exporting the fragcap library surface."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"

[features]
# Passed through to `fragcap-capture`, off by default for the same reason it is
# off there. Slice S09, plan decision D-2.
default = []
live    = ["fragcap-capture/live"]

[dependencies]
fragcap-core.workspace = true
fragcap-profile.workspace = true
fragcap-capture.workspace = true
fragcap-attr.workspace = true
fragcap-sink.workspace = true
fragcap-steam.workspace = true

[dev-dependencies]
serde_json.workspace = true
