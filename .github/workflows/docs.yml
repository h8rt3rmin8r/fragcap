# Documentation site build and deploy. Specification 22, 24.2.
#
# The site is a Fumadocs static export under site/. On a pull request this
# builds the export and asserts the static-hosting markers, without deploying.
# On the default branch it builds and then deploys to GitHub Pages.
#
# Node and pnpm are pinned so a Pages build matches the local build the lockfile
# was produced with (Node 24, pnpm 9.15). This workflow is a pinned artifact;
# the reasoning for the version pins is recorded in the changelog decisions
# fragment for slice S18c.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# GitHub Pages allows one concurrent deployment; do not cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.0"

jobs:
  build:
    name: build the static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: site
        run: pnpm build

      # The export is unservable on GitHub Pages without these: .nojekyll stops
      # Jekyll from stripping the framework asset directory (the site would
      # render unstyled), and CNAME binds the custom domain. The build writes
      # them; this asserts they are present rather than trusting it.
      - name: Assert static-hosting markers
        working-directory: site
        run: |
          test -f out/.nojekyll || { echo "missing out/.nojekyll"; exit 1; }
          test -f out/CNAME || { echo "missing out/CNAME"; exit 1; }
          grep -qx 'fragcap.com' out/CNAME || { echo "out/CNAME is not fragcap.com"; exit 1; }

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
