# External reference verification. Specification 22.5, 24.2.
#
# The documentation linter's link mode checks that the external references cited
# in the glossary respond. Link liveness is not a property of a change but of
# the outside world, so this runs on a weekly schedule rather than per commit; a
# dead link then surfaces within a week without failing an unrelated pull
# request. Manual dispatch is kept for an on-demand run.
#
# This workflow is a pinned artifact; see the changelog decisions fragment for
# slice S18c.
name: links

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify external references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # link mode needs curl, which the ubuntu runner ships. It exits 2 (could
      # not run) if curl is absent and 1 on a dead link.
      - name: Verify external references
        run: bash scripts/lint-docs.sh link
