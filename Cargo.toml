[workspace]
members  = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version      = "0.8.0"
edition      = "2021"
# The minimum version a consumer needs. Distinct from the toolchain this
# repository builds with, which rust-toolchain.toml pins. Verified by
# `cargo xtask msrv`; see specs/001-workspace-scaffold/research.md R-1.
rust-version = "1.88"
license      = "Apache-2.0"
repository   = "https://github.com/h8rt3rmin8r/fragcap"
homepage     = "https://github.com/h8rt3rmin8r/fragcap"
authors      = ["William Thompson"]
keywords     = ["pcap", "pcapng", "capture", "attribution", "windows"]
categories   = ["network-programming"]

[workspace.dependencies]
# External. Slice S02, plan D-1: reference-counted payload clones, MIT licensed,
# declares a 1.57 minimum, and pulls in no transitive dependencies.
bytes           = "1.12"

# External. Slice S102, issue #280: the owned native Deep Capture proxy stack.
# Every direct package is exact-pinned and default features are disabled so an
# upgrade, crypto-provider change, or new native build input is always a visible
# review event. Rust 1.88 is the measured floor because rcgen 0.14.10 and the
# selected time graph declare it. See the S102 research and decisions fragment.
tokio = { version = "=1.53.1", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
hyper = { version = "=1.11.1", default-features = false, features = [
    "client",
    "http1",
    "http2",
    "server",
] }
hyper-util = { version = "=0.1.20", default-features = false, features = [
    "server-auto",
    "tokio",
] }
http-body-util = { version = "=0.1.5", default-features = false }
h2 = { version = "=0.4.19", default-features = false }
rustls = { version = "=0.23.43", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = [
    "ring",
    "tls12",
] }
rcgen = { version = "=0.14.10", default-features = false, features = [
    "ring",
    "zeroize",
] }
rustls-native-certs = { version = "=0.8.4", default-features = false }
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
quinn = { version = "=0.11.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
] }
x509-parser = { version = "=0.18.1", default-features = false }

# External. Slice S05, research R-1: TOML parsing for game profiles, with byte
# spans on every value so a diagnostic can point an author at their own line.
# Chosen over `toml` under the former Rust 1.82 policy because that crate's 1.1
# line declared Rust 1.85 and pinning it to 1.0 did not help. Retained because
# changing the parser is unrelated to the S102 MSRV increase. Two crates in the
# graph, no serde, MIT or Apache-2.0.
toml-span       = "0.7"

# External. Slice S05, research R-3: compiles the `path_regex` match predicate
# of specification section 10.3. Default features are off because
# `aho-corasick` and `memchr` accelerate scanning large haystacks and a haystack
# here is one process image path. `unicode` stays on: an image path can carry
# non-ASCII through a user or localized directory name, and a pattern must behave
# the way the documented engine behaves. The same engine evaluates in S12, which
# is a requirement rather than a coincidence. MIT or Apache-2.0.
regex           = { version = "1.13", default-features = false, features = [
    "std",
    "unicode",
] }

# External, optional. Slice S09, research R-1: the libpcap and npcap binding
# the live capture source is built on. Optional and off by default, so building
# the workspace and running the ordinary check set needs neither the capture
# driver nor its software development kit.
#
# Chosen over a hand-rolled binding because the alternative here is not
# arithmetic over a byte slice, as it was in S03 and S06, but a C ABI whose
# struct layouts must be transcribed by hand with nothing checking them against
# the header. A wrong offset in the packet header yields plausible timestamps
# that are wrong, which is the P-9 failure no test over synthetic data catches.
#
# MIT or Apache-2.0, and so is every crate it pulls. Declares Rust 1.64. Its
# build dependency remains on the 0.8 `libloading` line selected by pcap; S102
# does not rewrite an unrelated capture binding after raising the workspace
# floor.
pcap            = "2.4"

# External. Slice S10, research R-3: the attribution snapshot publication of
# specification section 11.6, which requires that the capture thread read the
# current snapshot without locking while the control thread replaces it.
#
# The alternative worth naming is `RwLock<Arc<Index>>`, which is the tempting
# one and is a lock: a reader can block behind a writer, and the reader here is
# the acquisition path that section 11.6 exists to keep unblocked. It would
# satisfy a test and not the requirement, which is worse than failing both.
# A hand-rolled `AtomicPtr` is correct and needs a reclamation scheme written
# in `unsafe`, in a workspace that has none outside a platform binding.
#
# MIT or Apache-2.0, no dependencies of its own, edition 2018 with no declared
# minimum toolchain, so it cannot move `cargo xtask msrv`.
arc-swap        = "1.9"

# External, optional. Two backends are built on this, and they share one entry
# rather than two on purpose.
#
# Slice S10, research R-1 and R-4: the IP Helper socket table and query-only
# process enumeration that flow attribution is built on, behind the
# `socket-table` feature.
#
# Slice S11, research R-1: the ETW session the process watcher consumes, behind
# the `etw` feature. Chosen over `ferrisetw`, which specification Appendix A
# names, on measured grounds: `ferrisetw` resolves to thirty crates including a
# bignum stack and a random number generator that a passive observer of process
# events has no use for, and it wraps this same generated binding a version line
# behind. The value in a platform binding is in who guarantees the struct
# layouts, which is the argument S09 gave for taking `pcap`, and it points here.
# The kernel process provider's events are fixed MOF layouts rather than
# manifest-based ones, so the schema parsing a wrapper would supply is not the
# parsing S11 needs.
#
# Pinned to the 0.36 line because `pcap` already resolves it there, so this adds
# no package to Cargo.lock at all. Taking the current line would put a second
# complete windows-sys tree in the graph for declarations that have not changed.
# S11 initially took 0.61 and moved to 0.36 during integration, having checked
# that every symbol its watcher names resolves there. MIT or Apache-2.0,
# declares Rust 1.64.
#
# Note that none of this is npcap. The IP Helper API and ETW both ship with the
# operating system, so neither backend needs a capture driver or a software
# development kit, which is why neither feature is `live`.
#
# `Win32_System_Time` is in the list and is not obvious: it gates
# `EVENT_TRACE_LOGFILEW` and `OpenTraceW`, not the ETW feature group.
#
# The named-pipe transport of slice S15 (specification section 14.2) adds
# `Win32_System_Pipes` (CreateNamedPipeW, ConnectNamedPipe, DisconnectNamedPipe),
# `Win32_Storage_FileSystem` (WriteFile, CreateFileW, the PIPE_ACCESS constants),
# `Win32_System_IO` (the OVERLAPPED type WriteFile names), and `Win32_Security`
# (the SECURITY_ATTRIBUTES type the pipe and file calls name; passed null). All
# are additive and change no resolved version; the pin stays at 0.36.
windows-sys     = { version = "0.36", default-features = false, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Time",
    "Win32_UI_Shell",
] }

# External. Slice S14, research D-a: the command line argument grammar of
# specification section 17.2, with the `derive` feature so the typed structs
# produce the flags, defaults, subcommands, and help text rather than a
# hand-maintained parser that would drift from the help the spec prints. It
# sits on `fragcap-cli` alone, at the top of the dependency graph where nothing
# reaches it, which `cargo xtask deps` enforces. MIT or Apache-2.0.
#
# Pinned exactly to 4.5.32 by S14 because later releases crossed the former
# Rust 1.82 floor. S102 raises the workspace floor for the native proxy graph
# but deliberately avoids combining that feature change with CLI parser and
# generated-help churn. Review this pin in a dedicated dependency update.
clap            = { version = "=4.5.32", features = ["derive", "wrap_help"] }

# External. Slice S14, research D-b: a portable console-interrupt hook so an
# operator interrupt during a capture becomes a clean `StopReason::Interrupt`
# and an exit-0 success, rather than a killed process. The standard library has
# no portable equivalent. Uses `SetConsoleCtrlHandler` on Windows. On
# `fragcap-cli` alone. MIT or Apache-2.0.
ctrlc           = "3.4"

# External, optional. Slice S034, research R-1: the embedded SQLite store the
# targets hint database is built on (issue #78), behind the `targets` feature at
# the facade, so a default build compiles neither the database engine nor a C
# toolchain for it. On `fragcap-targets` alone.
#
# `default-features = false` is load-bearing. rusqlite 0.40's default set enables
# a WebAssembly FFI backend (`ffi-sqlite-wasm-rs`) that drags roughly fourteen
# packages (the wasm-bindgen stack, js-sys, thiserror, bumpalo) into Cargo.lock
# for machinery this project never runs. With defaults off and only `bundled`,
# the delta is six packages: rusqlite, libsqlite3-sys, fallible-iterator,
# fallible-streaming-iterator, smallvec, and vcpkg (cc, bitflags, shlex,
# find-msvc-tools, and pkg-config are already in the graph via `pcap`).
#
# `bundled` compiles the SQLite amalgamation through `cc`, so there is no reliance
# on a system libsqlite3 and the Windows build is deterministic; the bundled
# SQLite carries the JSON1 functions. Chosen over a hand-rolled on-disk format,
# which would re-implement indexing, transactions, and JSON querying (the harder
# half remains), and over `sqlx`, which brings an async runtime and a far larger
# graph for a synchronous single-file local store.
#
# MIT or Apache-2.0 across the delta; the bundled SQLite amalgamation is
# public-domain C compiled by the MIT `libsqlite3-sys` crate. None of the six
# declares a `rust-version`; all compiled under the former Rust 1.82 floor,
# verified by S034. Taken as a compatible-range 0.40 pin
# rather than exact, with `cargo xtask msrv` as the standing gate should a future
# lock update raise the floor. See the S034 decisions fragment.
rusqlite        = { version = "0.40", default-features = false, features = [
    "bundled",
] }

# External, optional. Slice S035, research R-1: the HTTP client the targets hint
# database's live catalog seeder is built on (issue #78), behind the `net` feature
# on fragcap-targets and off by default, so a default build and the offline test
# suite pull neither a client nor a TLS stack. On fragcap-targets alone.
#
# `native-tls` (not rustls) is load-bearing for two independent reasons. The rustls
# path forces `webpki-roots`, whose bundled Mozilla root store is licensed
# CDLA-Permissive-2.0, outside this project's allowed set (MIT/Apache/BSD/ISC/
# Unicode-DFS/Zlib); native-tls uses the operating system trust store (schannel on
# Windows) and bundles no roots. And every client built on the `url` crate (ureq,
# attohttpc) pulls `idna` 1.x and the whole ICU4X stack, measured at 42 packages,
# the same graph S025 rejected `boon` for. `http_req` does its own URL parsing, so
# with native-tls it adds 18 packages, no ICU4X and no `ring`, all MIT or
# Apache-2.0.
#
# `net` is off by default, so `http_req` is not part of the ordinary MSRV build.
# The former 1.82 policy was verified with net off and the pinned toolchain with
# net on. `http_req` is smaller and less widely used
# than `ureq`; the risk is bounded because it sits behind the `CatalogSource` trait
# (swapping it is a one-module change) and is compiled but never run in CI. See the
# S035 decisions fragment.
http_req        = { version = "0.13", default-features = false, features = [
    "native-tls",
] }

# External. Slice S051, research D-1: the 63-bit anchor identifier is a BLAKE3
# truncation over a canonical anchor string. On `fragcap-targets` alone, so it is
# gated at the facade behind `targets` (the whole crate is the optional unit, the
# same arrangement as `rusqlite`) and a default build compiles no hasher.
# `default-features = false` drops the `std` feature the one-shot `blake3::hash`
# does not need; `rayon` is a separate non-default feature and is never enabled.
# Chosen over reusing the hand-rolled SHA-256 because the exported identifier is a
# durable contract the handoff plan names BLAKE3 for, and over a hand-rolled
# BLAKE3 because a wrong identity hash is a P-9 defect that ships silently.
# `CC0-1.0 OR Apache-2.0`; the OR resolves to the allowlisted Apache-2.0.
blake3          = { version = "1", default-features = false }

# External. Slice S051, research D-2: the NFKD step of handle normalization
# (specification section 5.2). On `fragcap-targets` alone. NFKD and Unicode
# general categories are large generated tables; hand-rolling them is the
# absurd-transcription case the project adds dependencies to avoid (the same
# argument as `pcap`'s struct layouts). MIT or Apache-2.0, low MSRV.
unicode-normalization = "0.1"

# External. Slice S051, research D-2: the general-category tests (`So`/`Sk`/`Cf`
# stripped before NFKD, `Mn` after) of handle normalization. On `fragcap-targets`
# alone. `default-features = false` with `general-category` drops the emoji data
# the algorithm does not consult. MIT or Apache-2.0.
unicode-properties = { version = "0.1", default-features = false, features = [
    "general-category",
] }

# External. Slice S051, research D-6: OS entropy for the unanchored 63-bit
# identifier. Already present in the graph (pulled transitively), so this adds
# only a direct edge, not a Cargo.lock crate. On `fragcap-targets` alone. MIT or
# Apache-2.0. The anchored path is deterministic and uses no entropy.
getrandom       = "0.4"

# External, test-only. Slice S07, research R-1: the JSON Lines writer is
# hand-rolled because its exact byte shape is the deliverable, and this parses
# every line it emits so validity is judged by something other than the writer.
# Never a runtime dependency; it appears only under [dev-dependencies].
serde_json      = "1.0"

# External, test-only. Slice S14: the CLI tests write profiles and capture
# output into a scratch directory the test constructs and cleans up, for
# `profile list` over a user directory and `run`/`tap` output files. Never a
# runtime dependency; it appears only under [dev-dependencies]. MIT or
# Apache-2.0.
tempfile        = "3.10"

fragcap-core    = { version = "0.8.0", path = "crates/fragcap-core" }
fragcap-profile = { version = "0.8.0", path = "crates/fragcap-profile" }
fragcap-capture = { version = "0.8.0", path = "crates/fragcap-capture" }
fragcap-attr    = { version = "0.8.0", path = "crates/fragcap-attr" }
fragcap-sink    = { version = "0.8.0", path = "crates/fragcap-sink" }
fragcap-steam   = { version = "0.8.0", path = "crates/fragcap-steam" }
fragcap-targets = { version = "0.8.0", path = "crates/fragcap-targets" }
fragcap-proxy   = { version = "0.8.0", path = "crates/fragcap-proxy" }
fragcap         = { version = "0.8.0", path = "crates/fragcap" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "debuginfo"
