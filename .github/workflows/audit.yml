# Dependency vulnerabilities and license policy. Specification 20.4, 24.2.
#
name: audit

on:
  push:
    branches: [main]
    paths-ignore:
      - AI_CONTEXT.md
      - CHANGELOG.md
      - CLAUDE.md
      - CONTRIBUTING.md
      - LICENSE
      - NOTICE
      - README.md
      - fragcap.code-workspace
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: advisories and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.89.0
      # Install the exact governed tool from its locked source graph, without
      # a Docker Hub bootstrap that can prevent the audit from running.
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.21.0 --locked
      - name: Audit all features
        run: cargo deny --locked --all-features check advisories licenses bans sources

      - name: Audit isolated Rust graphs
        run: |
          for manifest in \
            fuzz/Cargo.toml \
            performance/native-proxy/Cargo.toml \
            spikes/native-proxy/Cargo.toml \
            spikes/native-proxy/audit/Cargo.toml \
            spikes/http-mitm-proxy/Cargo.toml \
            spikes/http-mitm-proxy/audit/Cargo.toml
          do
            cargo deny --locked --all-features --manifest-path "$manifest" --config deny.toml check advisories
          done

  site:
    name: site dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.26.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Validate temporary site advisory exception
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const record = JSON.parse(readFileSync(
              "supply-chain/site-audit-exception-v1.json", "utf8"));
            if (record.id !== "GHSA-fc5q-39xc-vjpf" ||
                record.cve !== "CVE-2026-112366" ||
                record.package !== "picomatch" ||
                record.version !== "4.0.5" ||
                record.expires !== "2026-12-01") {
              throw Error("Site advisory exception identity changed");
            }
            const workspace = readFileSync("site/pnpm-workspace.yaml", "utf8");
            const expected = "auditConfig:\n  ignoreCves:\n" +
              "    - CVE-2026-112366\n";
            if (workspace.slice(workspace.indexOf("auditConfig:")) !==
                expected || workspace.includes("\naudit:\n")) {
              throw Error("Site advisory ignore configuration changed");
            }
            const lock = readFileSync("site/pnpm-lock.yaml", "utf8");
            const versions = [...lock.matchAll(/^  picomatch@([^:]+):/gm)];
            if (versions.length !== 2 ||
                versions.some((entry) => entry[1] !== "4.0.5")) {
              throw Error("Locked picomatch version changed");
            }
            const expiry = Date.parse(`${record.expires}T00:00:00Z`);
            if (!Number.isFinite(expiry) || Date.now() >= expiry) {
              throw Error(`Site advisory exception ${record.id} expired`);
            }
            console.log(`Exception-qualified site audit: ${record.id}`);
          '

      # Exact temporary exception tracked in issue #630; every other finding blocks.
      - name: Audit the complete site graph
        working-directory: site
        run: pnpm audit --audit-level low
