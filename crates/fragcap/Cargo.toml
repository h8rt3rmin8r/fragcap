[package]
name        = "fragcap"
description = "Facade re-exporting the fragcap library surface."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"

[features]
# Passed through, all three off by default for the same reason they are off in
# the crates that declare them. Slice S09 plan decision D-2, slice S10 task
# T002, and slice S11 plan decision D-2.
#
# They are three features and not one, because they gate three capabilities
# with three sets of requirements. `live` needs the npcap import library at
# link time and the driver at load time. `socket-table` needs neither, because
# the IP Helper API ships with the operating system. `etw` needs neither
# either, but does need an elevated session at run time. A single feature would
# make attribution unavailable to anyone without a capture driver software
# development kit, and would make either of the other two demand elevation that
# only one of them uses.
default      = []
live         = ["fragcap-capture/live"]
socket-table = ["fragcap-attr/socket-table"]
etw          = ["fragcap-attr/etw"]
# The targets hint database (issue #78, slice S034). Off by default so a default
# build compiles neither the embedded SQLite engine nor a C toolchain for it; a
# consumer that wants the store opts in. Slice S034 plan decision 7.
targets      = ["dep:fragcap-targets"]
# The live catalog seeder's HTTP source (issue #78, slice S035). Off by default;
# implies `targets`. A library consumer that wants to seed from the wire opts in.
net          = ["targets", "fragcap-targets/net"]

[dependencies]
fragcap-core.workspace = true
fragcap-profile.workspace = true
fragcap-capture.workspace = true
fragcap-attr.workspace = true
fragcap-sink.workspace = true
fragcap-steam.workspace = true
fragcap-targets = { workspace = true, optional = true }

# The Windows volume inventory adapter (slice S052) enumerates fixed volumes for
# the known-roots walk through GetLogicalDrives/GetDriveTypeW and reads each
# volume's stable GUID identity through GetVolumeNameForVolumeMountPointW, all in
# Win32_Storage_FileSystem, which the workspace pin already enables. windows-sys is
# already pinned at 0.36 across the workspace (via pcap), so this adds no Cargo.lock
# package. The adapter is `cfg(windows)` and only compiled behind the `targets`
# feature; a non-windows or non-targets build never touches it.
#
# Win32_System_Registry backs the machine-wide anti-cheat probe (slice S068):
# a registry-key-existence read, the same feature `fragcap-steam` and
# `fragcap-cli` already enable for the Steam install-path lookup, additive on
# the same already-resolved 0.36 pin (no `Cargo.lock` package added).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Registry"] }

[dev-dependencies]
serde_json.workspace = true
# Enables fragcap-steam's synthetic appinfo.vdf generator for this crate's own
# tests (tests/steam_source.rs), the same way fragcap-cli's dev-dependencies
# already do for its launch-accumulation tests.
fragcap-steam = { workspace = true, features = ["test-support"] }
