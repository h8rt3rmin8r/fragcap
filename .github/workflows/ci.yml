# Standard check set. Specification section 24.3; every gate here is blocking.
#
# NOTE: the `check` matrix first executed on 2026-08-06 and passed on both
# operating systems. The `neutrality` and `msrv` jobs in this file have still
# never completed: their first runs coincided with a GitHub incident and never
# acquired a runner. Do not count either as a passing check until one does.
name: ci

# Triggers are scoped deliberately. `on: push` unqualified plus `on:
# pull_request` fires BOTH for any branch with an open pull request, so every
# workflow ran twice and burned double the minutes. Scoping push to the default
# branch means a pull request gets exactly one run, and a merge gets one more.
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same ref. Without this, pushing three times
# to a branch leaves three runs competing for runners, and the two stale ones
# are pure waste.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; this action honors it.
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Repository conventions
        run: cargo run --package xtask -- lint

      - name: Dependency direction
        run: cargo run --package xtask -- deps

      - name: Publication licensing
        run: cargo run --package xtask -- license

      # Constitution P-11: the specification's Applies-To field must equal the
      # workspace version, and every changelog fragment must carry a valid
      # spec-impact line. OS-independent (file reads only), so it runs on both legs.
      - name: Specification version lock-step
        run: cargo run --package xtask -- spec

      # The wrapper compliance gate needs bash (for the vendored PowerShell
      # checker's POSIX twin and bash -n) and pwsh (for the PowerShell parse).
      # The ubuntu runner ships both; the checks are OS-independent, so running
      # them on one leg covers both wrappers. The windows runner does not carry
      # bash on PATH, which is why this is scoped to ubuntu.
      - name: Shell wrapper compliance
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --package xtask -- wrappers

      # The vendored skill set gate: .agents/skills/, skills-lock.json, and
      # git's index must agree. Added by slice S071 after a vendored skill was
      # found to have sat on disk and in the lock, and uncommitted, since the
      # founding commit, because nothing read that file. It shells out to git
      # and is otherwise OS-independent, so one leg covers it.
      - name: Vendored skill set
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --package xtask -- skills

      # The documentation linter (scripts/lint-docs.sh) enforces P-6: glossary
      # entry completeness, cross-link resolution, and index reproducibility. It
      # needs bash, so it is scoped to ubuntu like the wrapper gate.
      - name: Documentation check
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --package xtask -- docs check

  neutrality:
    # Constitution P-2 proven mechanically: fragcap-core must build where no
    # capture backend exists. A native Linux build is that proof, and needs no
    # cross-compilation setup.
    name: core builds without a capture backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build fragcap-core on a platform with no capture backend
        run: cargo build --package fragcap-core --locked

  msrv:
    # Verifies the minimum supported version declared in Cargo.toml.
    #
    # The complete default workspace includes the native proxy dependency graph
    # through fragcap-cli, so this proves both published metadata readability
    # and the selected S102 stack at the declared floor.
    name: minimum supported toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Build at the declared minimum
        run: cargo build --workspace --locked
