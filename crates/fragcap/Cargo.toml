[package]
name        = "fragcap"
description = "Facade re-exporting the fragcap library surface."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"

[features]
# Passed through, all three off by default for the same reason they are off in
# the crates that declare them. Slice S09 plan decision D-2, slice S10 task
# T002, and slice S11 plan decision D-2.
#
# They are three features and not one, because they gate three capabilities
# with three sets of requirements. `live` needs the npcap import library at
# link time and the driver at load time. `socket-table` needs neither, because
# the IP Helper API ships with the operating system. `etw` needs neither
# either, but does need an elevated session at run time. A single feature would
# make attribution unavailable to anyone without a capture driver software
# development kit, and would make either of the other two demand elevation that
# only one of them uses.
default      = []
live         = ["fragcap-capture/live"]
socket-table = ["fragcap-attr/socket-table"]
etw          = ["fragcap-attr/etw"]
# The targets hint database (issue #78, slice S034). Off by default so a default
# build compiles neither the embedded SQLite engine nor a C toolchain for it; a
# consumer that wants the store opts in. Slice S034 plan decision 7.
targets      = ["dep:fragcap-targets"]

[dependencies]
fragcap-core.workspace = true
fragcap-profile.workspace = true
fragcap-capture.workspace = true
fragcap-attr.workspace = true
fragcap-sink.workspace = true
fragcap-steam.workspace = true
fragcap-targets = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
