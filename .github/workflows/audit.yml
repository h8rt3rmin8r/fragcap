# Dependency vulnerabilities and license policy. Specification 20.4, 24.2.
#
name: audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: advisories and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      # Install the exact governed tool from its locked source graph, without
      # a Docker Hub bootstrap that can prevent the audit from running.
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit all features
        run: cargo deny --all-features check advisories licenses bans sources
