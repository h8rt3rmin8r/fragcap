[workspace]
members  = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
# The minimum version a consumer needs. Distinct from the toolchain this
# repository builds with, which rust-toolchain.toml pins. Verified by
# `cargo xtask msrv`; see specs/001-workspace-scaffold/research.md R-1.
rust-version = "1.82"
license      = "Apache-2.0"
repository   = "https://github.com/h8rt3rmin8r/fragcap"
homepage     = "https://github.com/h8rt3rmin8r/fragcap"
authors      = ["William Thompson"]
keywords     = ["pcap", "pcapng", "capture", "attribution", "windows"]
categories   = ["network-programming"]

[workspace.dependencies]
# External. Slice S02, plan D-1: reference-counted payload clones, MIT licensed,
# declares a 1.57 minimum, and pulls in no transitive dependencies.
bytes           = "1.12"

# External. Slice S05, research R-1: TOML parsing for game profiles, with byte
# spans on every value so a diagnostic can point an author at their own line.
# Chosen over `toml` because that crate's 1.1 line declares Rust 1.85 against
# this workspace's 1.82 minimum, and pinning it to 1.0 does not help: its own
# `toml_parser` dependency resolves to 1.1.3 and declares 1.85 too. Two crates
# in the graph, no serde, MIT or Apache-2.0.
toml-span       = "0.7"

# External. Slice S05, research R-3: compiles the `path_regex` match predicate
# of specification section 10.3. Default features are off because
# `aho-corasick` and `memchr` accelerate scanning large haystacks and a haystack
# here is one process image path. `unicode` stays on: an image path can carry
# non-ASCII through a user or localized directory name, and a pattern must behave
# the way the documented engine behaves. The same engine evaluates in S12, which
# is a requirement rather than a coincidence. MIT or Apache-2.0.
regex           = { version = "1.13", default-features = false, features = [
    "std",
    "unicode",
] }

# External, test-only. Slice S07, research R-1: the JSON Lines writer is
# hand-rolled because its exact byte shape is the deliverable, and this parses
# every line it emits so validity is judged by something other than the writer.
# Never a runtime dependency; it appears only under [dev-dependencies].
serde_json      = "1.0"

fragcap-core    = { version = "0.1.0", path = "crates/fragcap-core" }
fragcap-profile = { version = "0.1.0", path = "crates/fragcap-profile" }
fragcap-capture = { version = "0.1.0", path = "crates/fragcap-capture" }
fragcap-attr    = { version = "0.1.0", path = "crates/fragcap-attr" }
fragcap-sink    = { version = "0.1.0", path = "crates/fragcap-sink" }
fragcap-steam   = { version = "0.1.0", path = "crates/fragcap-steam" }
fragcap         = { version = "0.1.0", path = "crates/fragcap" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "debuginfo"
