name: Bug report
description: Something fragcap does incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you attach anything: scrub it.** Capture files carry addresses
        and, in some titles, session identifiers. Do not attach a raw capture
        to a public issue. Paste the derived facts instead, or open a security
        advisory if the detail is genuinely needed.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >-
        The exact invocation, and what state the system was in. If it involves
        a specific title, say which and at what stage (launcher,
        authentication, character select, gameplay, shutdown).
      placeholder: |
        1. fragcap capture 1 --duration 30m
        2. ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: fragcap doctor output
      description: >-
        Paste the full output. This covers the capture driver version, its
        installation options, privilege level, interface inventory, and ETW
        session availability, which is most of what is needed to triage.
      render: text
    validations:
      required: true

  - type: textarea
    id: statistics
    attributes:
      label: Capture statistics
      description: >-
        If the capture ran, paste the reported statistics, including every drop
        counter. A nonzero drop counter is frequently the whole answer.
      render: text

  - type: input
    id: version
    attributes:
      label: fragcap version
      placeholder: "Paste the output of: fragcap --version"
    validations:
      required: true

  - type: input
    id: npcap-version
    attributes:
      label: npcap version
      description: Enter the installed version when live packet capture was involved; otherwise enter "not applicable".
      placeholder: "Paste the version or enter not applicable"
    validations:
      required: true

  - type: dropdown
    id: npcap-options
    attributes:
      label: npcap installation options
      description: >-
        WinPcap API-compatible mode is required for live packet capture. Current
        Npcap installs loopback support automatically. If you are unsure,
        fragcap doctor reports readiness.
      options:
        - WinPcap API-compatible mode enabled
        - WinPcap API-compatible mode not enabled
        - Not sure
        - Not applicable; no live packet capture

  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 Pro 26200"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I have removed addresses, account identifiers, and session tokens from everything above.
          required: true
        - label: If this report involves live Capture or Deep Capture, I ran the invocation from an administrative shell.
