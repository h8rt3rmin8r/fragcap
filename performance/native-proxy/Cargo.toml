[package]
name = "fragcap-native-performance"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]
members = ["."]

[dependencies]
bytes = "1.12"
fragcap-proxy = { path = "../../crates/fragcap-proxy" }
fragcap = { path = "../../crates/fragcap", features = ["deep-capture"] }
h2 = { version = "=0.4.19", default-features = false }
h3 = { version = "=0.0.8", default-features = false }
h3-quinn = { version = "=0.0.10", default-features = false }
http = "1.4"
quinn = { version = "=0.11.11", default-features = false, features = ["platform-verifier", "ring", "runtime-tokio", "rustls"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0"
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.36", default-features = false, features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
