name: Feature request
description: Propose a capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Read the non-goals in `README.md` and constitution principle P-1 first.
        Capture is passive. Deep Capture permits explicit, target-scoped,
        reversible local proxy inspection for authorized sessions. Neither mode
        permits covert target instrumentation, and a proposal requiring a
        denylisted technique will be declined regardless of how useful it would
        be. That is a scope boundary, not a judgment about the request.

        Check the open issues and GitHub milestones too. The capability may
        already be planned, and specification section 28 records work deferred
        beyond the current release.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What are you trying to observe or understand that you cannot today?
        Describe the problem rather than the solution; the solution is often
        different from the one that comes to mind first.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: What fragcap would do. Include the invocation if it is a CLI change.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: >-
        Existing tooling, a different fragcap invocation, or post-processing
        the output. If the capability is reachable by combining what already
        exists, that is useful to know.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require injection, target hooks, target memory reads, executable modification, Winsock catalog changes, packet interception drivers, or target TLS key extraction.
          required: true
        - label: Any proposed Deep Capture proxy or trust change is explicit, target-scoped, reversible, auditable, and never a silent system-wide fallback or certificate-pinning bypass.
          required: true
        - label: I have checked the open issues, GitHub milestones, and specification section 28 for overlap.
          required: true
