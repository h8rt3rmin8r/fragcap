[package]
name        = "fragcap-attr"
description = "Flow attribution and process watching."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"

[features]
# Both off by default, deliberately, and separate from each other.
#
# `socket-table` compiles the socket table backend, which binds the operating
# system's IP Helper API and process enumeration. Slice S10 success criterion
# SC-010.
#
# `etw` compiles the ETW process watcher, whose tests need an elevated Windows
# session. Slice S11 success criterion SC-009.
#
# Leaving both off is what lets `cargo xtask ci` pass on any machine, with no
# elevation and no Windows at all.
#
# Neither borrows `fragcap-capture`'s `live`. That feature means "links against
# the npcap import library"; neither of these does, because the IP Helper API
# and ETW both ship with the operating system. Folding them together would make
# a build that wanted attribution also require a capture driver software
# development kit it never calls.
#
# They are two features rather than one because they are two capabilities with
# two failure modes: the socket table needs no privilege and answers which
# process holds a socket, while an ETW session needs elevation and answers which
# processes exist. A build that wants one and not the other is an ordinary thing
# to want.
#
# `etw` is named for the mechanism rather than the capability. A feature called
# `process` would suggest the process tree is behind it, and the tree is behind
# nothing: it lives in `fragcap-core` and is testable everywhere.
default      = []
socket-table = ["dep:windows-sys"]
etw          = ["dep:windows-sys"]

[dependencies]
fragcap-core.workspace = true
arc-swap.workspace     = true

# Windows only, and only with one of the features above. One entry serves both
# backends; see the workspace manifest for why it is pinned to the 0.36 line.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }
