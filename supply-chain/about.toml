# cargo-about 0.9.2 configuration for the shipped Windows dependency notices.
accepted = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  # S200's exact smoltcp 0.12.0 and managed 0.8.0 exception is checked by xtask.
  "0BSD",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
workarounds = ["ring", "rustls"]
