# Dependency vulnerabilities and license policy. Specification 20.4, 24.2.
#
name: audit

on:
  push:
    branches: [main]
    paths-ignore:
      - AI_CONTEXT.md
      - CHANGELOG.md
      - CLAUDE.md
      - CONTRIBUTING.md
      - LICENSE
      - NOTICE
      - README.md
      - fragcap.code-workspace
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: advisories and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.88.0
      # Install the exact governed tool from its locked source graph, without
      # a Docker Hub bootstrap that can prevent the audit from running.
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit all features
        run: cargo deny --locked --all-features check advisories licenses bans sources

      - name: Audit isolated Rust graphs
        run: |
          for manifest in \
            fuzz/Cargo.toml \
            performance/native-proxy/Cargo.toml \
            spikes/native-proxy/Cargo.toml \
            spikes/native-proxy/audit/Cargo.toml \
            spikes/http-mitm-proxy/Cargo.toml \
            spikes/http-mitm-proxy/audit/Cargo.toml
          do
            cargo deny --locked --all-features --manifest-path "$manifest" --config deny.toml check advisories
          done

  site:
    name: site dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.26.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Audit the complete site graph
        working-directory: site
        run: pnpm audit --audit-level low
