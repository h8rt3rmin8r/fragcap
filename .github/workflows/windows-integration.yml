name: Windows native integration

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - AI_CONTEXT.md
      - CHANGELOG.md
      - CLAUDE.md
      - CONTRIBUTING.md
      - LICENSE
      - NOTICE
      - README.md
      - fragcap.code-workspace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native-integration:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Acquire exact signed WinDivert probe component
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $component = (Get-Content -LiteralPath integration/windows-package-contract-v1.json -Raw | ConvertFrom-Json).windivert
          $binary = Join-Path $env:RUNNER_TEMP 'WinDivert-2.2.2-A.zip'
          $source = Join-Path $env:RUNNER_TEMP 'WinDivert-source.zip'
          Invoke-WebRequest -Uri $component.binary_url -OutFile $binary -MaximumRedirection 5
          Invoke-WebRequest -Uri $component.source_url -OutFile $source -MaximumRedirection 5
          if ((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant() -cne $component.binary_sha256) { throw 'WinDivert archive hash mismatch' }
          if ((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant() -cne $component.source_sha256) { throw 'WinDivert source hash mismatch' }
          $expanded = Join-Path $env:RUNNER_TEMP 'windivert-expanded'
          $verified = Join-Path $env:RUNNER_TEMP 'windivert-probe'
          Expand-Archive -LiteralPath $binary -DestinationPath $expanded
          New-Item -ItemType Directory -Path $verified -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $expanded 'WinDivert-2.2.2-A/x64/WinDivert.dll') -Destination (Join-Path $verified 'WinDivert.dll')
          Copy-Item -LiteralPath (Join-Path $expanded 'WinDivert-2.2.2-A/x64/WinDivert64.sys') -Destination (Join-Path $verified 'WinDivert64.sys')
          Copy-Item -LiteralPath (Join-Path $expanded 'WinDivert-2.2.2-A/LICENSE') -Destination (Join-Path $verified 'WinDivert-LICENSE.txt')
          Copy-Item -LiteralPath $source -Destination (Join-Path $verified 'WinDivert-source.zip')
          if ((Get-FileHash -LiteralPath (Join-Path $verified 'WinDivert.dll') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $component.dll_sha256) { throw 'WinDivert DLL hash mismatch' }
          if ((Get-FileHash -LiteralPath (Join-Path $verified 'WinDivert64.sys') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $component.driver_sha256) { throw 'WinDivert driver hash mismatch' }
          if ((Get-FileHash -LiteralPath (Join-Path $verified 'WinDivert-LICENSE.txt') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $component.license_sha256) { throw 'WinDivert license hash mismatch' }
          $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path $verified 'WinDivert64.sys')
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -cne $component.driver_signer_thumbprint) { throw 'WinDivert driver signature mismatch' }
          "WINDIVERT_VERIFIED_ROOT=$verified" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Probe direct socket event timing on disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath integration/direct-route-matrix-v1.json -Raw | ConvertFrom-Json
          if ($manifest.schema_version -ne 1) { throw 'Unknown direct route matrix version' }
          $rows = @($manifest.required_rows | Where-Object tier -eq 'windows-driver')
          if ($rows.Count -eq 0) { throw 'No required Windows direct route rows' }
          $listed = & cargo test --locked -p fragcap --features direct-route disposable_ --lib -- --ignored --list 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list disposable direct route probes' }
          $names = @([regex]::Matches(($listed -join "`n"), '(?m)^\S+::(disposable_\w+): test$') | ForEach-Object { $_.Groups[1].Value })
          if ($names.Count -eq 0) { throw 'No disposable direct route probes found' }
          foreach ($row in $rows) {
            if (-not $row.probe -or $row.probe -cnotin $names) { throw "Unmapped direct route row: $($row.id)" }
          }
          $result = & cargo test --locked -p fragcap --features direct-route disposable_ --lib -- --ignored --nocapture --test-threads=1 2>&1
          $result | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw 'Disposable direct route probe failed' }
          if (-not [regex]::IsMatch(($result -join "`n"), 'S201 candidate timing: receipt_ns=\d+, socket_event_published_ns=Some\(\d+\), process_proof_observed_ns=Some\(\d+\), decision_ns=\d+, held_ns=\d+, outcome=selected')) { throw 'Managed chain omitted the complete selected-candidate timing timeline' }
          $summary = [regex]::Match(($result -join "`n"), 'test result: ok\. (\d+) passed; 0 failed; 0 ignored;')
          if (-not $summary.Success -or [int]$summary.Groups[1].Value -ne $names.Count) { throw 'A required disposable probe was skipped' }
          Write-Host "Direct route matrix: $($rows.Count) Windows rows mapped to $($names.Count) passing probes; zero skipped"
          $chainProbe = 'deep_capture::direct_runtime::tests::disposable_cold_platform_publisher_final_chain'
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            $repeat = & cargo test --locked -p fragcap --features direct-route $chainProbe --lib -- --ignored --exact --nocapture --test-threads=1 2>&1
            $repeat | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -ne 0 -or -not [regex]::IsMatch(($repeat -join "`n"), 'test result: ok\. 1 passed; 0 failed; 0 ignored;')) {
              throw "Managed direct-route chain failed on repeat $attempt of 5"
            }
            if (-not [regex]::IsMatch(($repeat -join "`n"), 'S201 candidate timing: receipt_ns=\d+, socket_event_published_ns=Some\(\d+\), process_proof_observed_ns=Some\(\d+\), decision_ns=\d+, held_ns=\d+, outcome=selected')) { throw "Managed chain timing incomplete on repeat $attempt of 5" }
          }
          Write-Host 'Managed direct-route chain: 5 additional exact runs passed'

      - name: Download temporary Npcap SDK build input
        shell: pwsh
        run: |
          curl.exe --fail --silent --show-error --location https://npcap.com/dist/npcap-sdk-1.16.zip --output "$env:RUNNER_TEMP\npcap-sdk.zip"
          if ((Get-FileHash -LiteralPath "$env:RUNNER_TEMP\npcap-sdk.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f0a8be7778ee3ae1b99bbbecb27a3ff0f6c111a4093f1c78c5c5a099607184db') { throw 'Npcap SDK checksum mismatch' }
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\npcap-sdk.zip" -DestinationPath "$env:RUNNER_TEMP\npcap-sdk"
          "LIB=$env:RUNNER_TEMP\npcap-sdk\Lib\x64;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build official-feature binary
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --locked --release -p fragcap-cli --features live,socket-table,etw,direct-route

      - name: Create staged install layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target\windows-integration\stage -Force | Out-Null
          Copy-Item -LiteralPath target\release\fragcap.exe -Destination target\windows-integration\stage\fragcap.exe
          foreach ($name in @('WinDivert.dll', 'WinDivert64.sys', 'WinDivert-LICENSE.txt', 'WinDivert-source.zip')) {
            Copy-Item -LiteralPath (Join-Path $env:WINDIVERT_VERIFIED_ROOT $name) -Destination (Join-Path 'target\windows-integration\stage' $name)
          }

      - name: Run complete hosted matrix
        run: cargo xtask windows-integration --run hosted --binary target\windows-integration\stage\fragcap.exe --report target\windows-integration\hosted.jsonl

      - name: Validate sanitized summary
        run: cargo xtask windows-integration --validate-report target\windows-integration\hosted.summary.json

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-integration-summary
          path: target/windows-integration/hosted.summary.json
          if-no-files-found: error
