[package]
name        = "fragcap-targets"
description = "Targets hint database: an embedded store of game launch hints and its schema-conformant export."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"

[features]
# The live catalog seeder's HTTP source (issue #78, slice S035). Off by default so
# a default build and the offline test suite compile neither the HTTP client nor a
# TLS stack; the seeder logic, the offline FixtureCatalog, the gate, and the
# per-tier merge are all in the default build and fully tested without it. The
# maintainer builds with `net` to seed from the wire.
net = ["dep:http_req"]

[dependencies]
fragcap-profile.workspace = true
serde_json.workspace      = true
rusqlite = { workspace = true }
http_req = { workspace = true, optional = true }
# The target entry model (slice S051): BLAKE3 for the anchor identifier, the two
# Unicode crates for handle normalization, getrandom for the unanchored id. Not
# optional here, matching rusqlite: the whole crate is the unit gated at the
# facade behind `targets`, so a default build compiles none of them.
blake3.workspace                = true
unicode-normalization.workspace = true
unicode-properties.workspace    = true
getrandom.workspace             = true

[dev-dependencies]
fragcap-profile.workspace = true
serde_json.workspace      = true
