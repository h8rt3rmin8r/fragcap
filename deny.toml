# Dependency license and advisory policy, specification section 20.4.
#
# Rust dependency licenses remain restricted. Official WinDivert 2.2.2-A is a
# separately distributed LGPLv3 binary component with exact source and package
# obligations, not a Cargo dependency or a general license exception.

[licenses]
# The permitted set, verbatim from specification section 20.4.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
include-dev = true

[[licenses.exceptions]]
# The project's own crates.
allow = ["Apache-2.0"]
name  = "fragcap"

[bans]
multiple-versions = "warn"
multiple-versions-include-dev = true
wildcards         = "deny"

[advisories]
yanked       = "deny"
unmaintained = "all"
unsound      = "all"

[graph]
all-features = true
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
